[package]
name = "abbey-desktop"
version = "2.6.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Abbey desktop client — a Tauri 2 front end for the read-only Abbey application core"
license = "MIT"
authors = ["Donald Filimon"]

[[bin]]
name = "abbey-desktop"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No `tauri-plugin-shell`, `-fs`, `-http`, `-process`, `-dialog`, or `-opener`.
# The desktop client exposes four enumerated read-only commands and nothing
# else; a generic "run this command" bridge is not something that can be added
# by accident if the plugin providing it is absent from this table.
# The one deliberate execution-adjacent exception is `tauri-plugin-updater`:
# it downloads and replaces this app bundle from the pinned endpoint in
# `tauri.conf.json` and only after verifying the artifact against the pinned
# Ed25519 public key there. It grants no other network or shell authority.
tauri = { version = "2", features = [] }
abbey = { path = "../.." }
tauri-plugin-updater = "2.14.0"

# The native macOS window appearance (`src/appearance.rs`) installs real AppKit
# material — `NSGlassEffectView` / `NSVisualEffectView` — into the window's
# titlebar strip. These three crates are not new to this build: Tauri already
# depends on exactly these versions on macOS, so this adds direct dependency
# edges, not new crates. `src/appearance.rs` is the only AppKit caller in the
# tree; nothing else may use them, and nothing here is reachable on a
# non-macOS target.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSBox",
  "NSColor",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSVisualEffectView",
  "NSGlassEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGeometry",
  "objc2-core-foundation",
] }

[features]
default = []
# Build the desktop client against Abbey's personal edition. This changes the
# bundle identity (see `tauri.personal.conf.json`, generated from
# `abbey::edition`) and the config/state/credential namespaces it reads. It
# grants no extra runtime capability — `CapabilitySet` is identical in both
# editions.
personal-edition = ["abbey/personal-edition"]

# Test-only. Both crates are already in this workspace's dependency graph
# through `tauri-plugin-updater` — they are named here so the updater's own
# verification path (`tests/updater_signature.rs`) can be run directly, with
# the same crate the plugin uses, against the key this client pins.
[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
# Public updater API tests use a mock runtime and disposable filesystem roots.
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# Dependency-contract/fixture parsing only; actual plugin extraction is separate.
zip = { version = "=9.0.5", default-features = false }
sha2 = "0.10"
