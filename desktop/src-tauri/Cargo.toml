[package]
name = "abbey-desktop"
version = "2.6.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Abbey desktop client — a Tauri 2 front end for the read-only Abbey application core"
license = "MIT"
authors = ["Donald Filimon"]

[[bin]]
name = "abbey-desktop"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No `tauri-plugin-shell`, `-fs`, `-http`, `-process`, or `-dialog`. The desktop
# client exposes four enumerated read-only commands and nothing else; a generic
# "run this command" bridge is not something that can be added by accident if
# the plugin providing it is absent from this table.
tauri = { version = "2", features = [] }
abbey = { path = "../.." }

[features]
default = []
# Build the desktop client against Abbey's personal edition. This changes the
# bundle identity (see `tauri.personal.conf.json`, generated from
# `abbey::edition`) and the config/state/credential namespaces it reads. It
# grants no extra runtime capability — `CapabilitySet` is identical in both
# editions.
personal-edition = ["abbey/personal-edition"]
