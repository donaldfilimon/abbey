name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ABBEY_TOOLCHAIN: nightly-2026-09-01
  # This must match rust-toolchain.toml at ABI_REVISION until that immutable
  # integration pin advances.
  ABI_TOOLCHAIN: nightly-2026-08-20
  ABI_REVISION: 21f2e2f0e5a5ec325a67dc8f6b05be360b1ed5f3
  # WDBX was extracted from abi on 2026-08-22. abbey consumes abi-wdbx and
  # abi-compute from it directly, and also transitively through abi-worker and
  # abi-sea, so all three checkouts must be siblings or Cargo resolves two
  # non-unifying copies of abi-wdbx. The workflow fetches both siblings as
  # tokenless public source and fails closed if either becomes private; the
  # immutable pins remain mandatory.
  WDBX_REVISION: f42b9789eabcf89f952df0a160a7b6837c5acb57

# Self-hosted jobs are restricted to trusted same-repository events. Fork code
# must never run on machines that can reach local developer state or credentials.
jobs:
  gate-linux:
    name: gate (Linux ARM64)
    if: >
      vars.ABBEY_LINUX_ARM64_RUNNER == 'enabled' &&
      github.repository == 'donaldfilimon/abbey' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, Linux, ARM64, abbey]
    steps:
      - name: Check out Abbey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: abbey
          persist-credentials: false

      - name: Check out the verified ABI dependency
        run: >-
          ./abbey/tools/ci/checkout-public-revision.sh
          donaldfilimon/abi "${ABI_REVISION}" abi

      - name: Check out the public WDBX substrate
        run: >-
          ./abbey/tools/ci/checkout-public-revision.sh
          donaldfilimon/wdbx "${WDBX_REVISION}" wdbx

      - name: Install pinned ABI toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.ABI_TOOLCHAIN }}
          components: rustfmt, clippy, rust-src

      - name: Install pinned Abbey toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.ABBEY_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Build the real ABI binary
        working-directory: abi
        run: ./tools/cargo.sh build -p abi-cli

      - name: Gate both Abbey feature sets
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: ./check.sh

      - name: Install cargo-audit if absent
        run: |
          command -v cargo-audit >/dev/null 2>&1 && exit 0
          cargo install cargo-audit --locked

      - name: RustSec dependency scan
        working-directory: abbey
        env:
          ABBEY_DEP_SCAN_REQUIRE: "1"
        run: ./tools/security/run-dep-scan.sh

      - name: Warning-denied API docs and release binary
        working-directory: abbey
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items
          cargo build --release --locked
          ./target/release/abbey --version

      - name: Release install and provider inventory smoke
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: |
          smoke_root="${RUNNER_TEMP}/abbey-install-smoke"
          mkdir -p "$smoke_root/bin" "$smoke_root/home"
          ABBEY_INSTALL_DIR="$smoke_root/bin" \
            ABBEY_COMPLETION_HOME="$smoke_root/home" ./install.sh
          export HOME="$smoke_root/home"
          export XDG_CONFIG_HOME="$smoke_root/home/.config"
          export XDG_STATE_HOME="$smoke_root/home/.local/state"
          export ABBEY_CONFIG="$smoke_root/home/.config/abbey/config.toml"
          export ABBEY_STATE_DIR="$smoke_root/state"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$ABBEY_STATE_DIR"
          "$smoke_root/bin/abbey" --version
          "$smoke_root/bin/abbey" plugins abi list >/dev/null
          ABBEY_BACKEND=abi "$smoke_root/bin/abbey" mcp status >/dev/null
          ABBEY_BACKEND=fm "$smoke_root/bin/abbey" mcp paths >/dev/null
          "$smoke_root/bin/abbey" skills >/dev/null

      - name: ABI-backed local mesh proof
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
          ABBEY_STATE_DIR: ${{ runner.temp }}/abbey-mesh-state
        run: cargo run --release --bin abbey -- mesh local-demo --nodes 3 --json

      - name: Clean runner workspace
        if: always()
        run: |
          for path in \
            "$GITHUB_WORKSPACE/abbey" \
            "$GITHUB_WORKSPACE/abi" \
            "$GITHUB_WORKSPACE/wdbx" \
            "$RUNNER_TEMP/abbey-mesh-state" \
            "$RUNNER_TEMP/abbey-install-smoke"
          do
            if [ -e "$path" ]; then
              find "$path" -depth -delete
            fi
          done

  gate-macos:
    name: gate (macOS ARM64 adjunct)
    if: >
      vars.ABBEY_MACOS_ARM64_RUNNER == 'enabled' &&
      github.repository == 'donaldfilimon/abbey' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, abbey]
    steps:
      - name: Check out Abbey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: abbey
          persist-credentials: false

      - name: Check out the verified ABI dependency
        run: >-
          ./abbey/tools/ci/checkout-public-revision.sh
          donaldfilimon/abi "${ABI_REVISION}" abi

      - name: Check out the public WDBX substrate
        run: >-
          ./abbey/tools/ci/checkout-public-revision.sh
          donaldfilimon/wdbx "${WDBX_REVISION}" wdbx

      - name: Prefer system compiler and linker tools
        run: |
          for directory in /usr/bin /bin /usr/sbin /sbin; do
            echo "$directory" >> "$GITHUB_PATH"
          done
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          test "$(command -v cc)" = /usr/bin/cc

      - name: Install pinned ABI toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.ABI_TOOLCHAIN }}
          components: rustfmt, clippy, rust-src

      - name: Install pinned Abbey toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.ABBEY_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Build the real ABI binary
        working-directory: abi
        run: ./tools/cargo.sh build -p abi-cli

      - name: Gate both Abbey feature sets
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: ./check.sh

      - name: Install cargo-audit if absent
        run: |
          command -v cargo-audit >/dev/null 2>&1 && exit 0
          cargo install cargo-audit --locked

      - name: RustSec dependency scan
        working-directory: abbey
        env:
          ABBEY_DEP_SCAN_REQUIRE: "1"
        run: ./tools/security/run-dep-scan.sh

      - name: Warning-denied API docs and release binary
        working-directory: abbey
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items
          cargo build --release --locked
          ./target/release/abbey --version

      - name: Release install and provider inventory smoke
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: |
          smoke_root="${RUNNER_TEMP}/abbey-install-smoke"
          mkdir -p "$smoke_root/bin" "$smoke_root/home"
          ABBEY_INSTALL_DIR="$smoke_root/bin" \
            ABBEY_COMPLETION_HOME="$smoke_root/home" ./install.sh
          export HOME="$smoke_root/home"
          export XDG_CONFIG_HOME="$smoke_root/home/.config"
          export XDG_STATE_HOME="$smoke_root/home/.local/state"
          export ABBEY_CONFIG="$smoke_root/home/.config/abbey/config.toml"
          export ABBEY_STATE_DIR="$smoke_root/state"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$ABBEY_STATE_DIR"
          "$smoke_root/bin/abbey" --version
          "$smoke_root/bin/abbey" plugins abi list >/dev/null
          ABBEY_BACKEND=abi "$smoke_root/bin/abbey" mcp status >/dev/null
          ABBEY_BACKEND=fm "$smoke_root/bin/abbey" mcp paths >/dev/null
          "$smoke_root/bin/abbey" skills >/dev/null

      - name: ABI-backed local mesh proof
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
          ABBEY_STATE_DIR: ${{ runner.temp }}/abbey-mesh-state
        run: cargo run --release --bin abbey -- mesh local-demo --nodes 3 --json

      - name: Clean runner workspace
        if: always()
        run: |
          for path in \
            "$GITHUB_WORKSPACE/abbey" \
            "$GITHUB_WORKSPACE/abi" \
            "$GITHUB_WORKSPACE/wdbx" \
            "$RUNNER_TEMP/abbey-mesh-state" \
            "$RUNNER_TEMP/abbey-install-smoke"
          do
            if [ -e "$path" ]; then
              find "$path" -depth -delete
            fi
          done

  # Fork code runs only on GitHub-hosted infrastructure. This exercises the
  # real portable Abbey gate against the same immutable ABI and WDBX revisions
  # without exposing an owner machine, repository secret, or local state.
  gate-forks:
    name: gate (GitHub-hosted fork)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out Abbey
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: abbey
          persist-credentials: false

      - name: Check out the verified ABI dependency
        run: >-
          ./abbey/tools/ci/checkout-public-revision.sh
          donaldfilimon/abi "${ABI_REVISION}" abi

      - name: Check out the public WDBX substrate
        run: >-
          ./abbey/tools/ci/checkout-public-revision.sh
          donaldfilimon/wdbx "${WDBX_REVISION}" wdbx

      - name: Install pinned ABI toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.ABI_TOOLCHAIN }}
          components: rustfmt, clippy, rust-src

      - name: Install pinned Abbey toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.ABBEY_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Build the real ABI binary
        working-directory: abi
        run: ./tools/cargo.sh build -p abi-cli

      - name: Gate all portable Abbey modes
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: ./check.sh
