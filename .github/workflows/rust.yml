name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ABI_REVISION: da49d96d425074d08e4375e6b1b57a2756fb561b
  # WDBX was extracted from abi on 2026-08-22. abbey consumes abi-wdbx and
  # abi-compute from it directly, and also transitively through abi-worker and
  # abi-sea, so all three checkouts must be siblings or Cargo resolves two
  # non-unifying copies of abi-wdbx. The repository is private, so a
  # WDBX_CHECKOUT_TOKEN secret with read access is required.
  WDBX_REVISION: f6c480652f73c1a16942ce8bc176adf32d73e1d1

# Self-hosted jobs are restricted to trusted same-repository events. Fork code
# must never run on machines that can reach local developer state or credentials.
jobs:
  gate-linux:
    name: gate (Linux ARM64)
    if: >
      vars.ABBEY_LINUX_ARM64_RUNNER == 'enabled' &&
      github.repository == 'donaldfilimon/abbey' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, Linux, ARM64, abbey]
    steps:
      - name: Check out Abbey
        uses: actions/checkout@v4
        with:
          path: abbey

      - name: Check out the verified ABI dependency
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/abi
          ref: ${{ env.ABI_REVISION }}
          path: abi

      - name: Check out the WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx-substrate
          ref: ${{ env.WDBX_REVISION }}
          token: ${{ secrets.WDBX_CHECKOUT_TOKEN }}
          path: wdbx

      - name: Install pinned toolchain
        working-directory: abbey
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Build the real ABI binary
        working-directory: abi
        run: ./tools/cargo.sh build -p abi-cli

      - name: Gate both Abbey feature sets
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: ./check.sh

      - name: Install cargo-audit if absent
        run: |
          command -v cargo-audit >/dev/null 2>&1 && exit 0
          cargo install cargo-audit --locked

      - name: RustSec dependency scan
        working-directory: abbey
        env:
          ABBEY_DEP_SCAN_REQUIRE: "1"
        run: ./tools/security/run-dep-scan.sh

      - name: Warning-denied API docs and release binary
        working-directory: abbey
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items
          cargo build --release --locked
          ./target/release/abbey --version

      - name: Release install and provider inventory smoke
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: |
          smoke_root="${RUNNER_TEMP}/abbey-install-smoke"
          mkdir -p "$smoke_root/bin" "$smoke_root/home"
          ABBEY_INSTALL_DIR="$smoke_root/bin" \
            ABBEY_COMPLETION_HOME="$smoke_root/home" ./install.sh
          export HOME="$smoke_root/home"
          export XDG_CONFIG_HOME="$smoke_root/home/.config"
          export XDG_STATE_HOME="$smoke_root/home/.local/state"
          export ABBEY_CONFIG="$smoke_root/home/.config/abbey/config.toml"
          export ABBEY_STATE_DIR="$smoke_root/state"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$ABBEY_STATE_DIR"
          "$smoke_root/bin/abbey" --version
          "$smoke_root/bin/abbey" plugins abi list >/dev/null
          ABBEY_BACKEND=abi "$smoke_root/bin/abbey" mcp status >/dev/null
          ABBEY_BACKEND=fm "$smoke_root/bin/abbey" mcp paths >/dev/null
          "$smoke_root/bin/abbey" skills >/dev/null

      - name: ABI-backed local mesh proof
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
          ABBEY_STATE_DIR: ${{ runner.temp }}/abbey-mesh-state
        run: cargo run --release --bin abbey -- mesh local-demo --nodes 3 --json

      - name: Clean runner workspace
        if: always()
        run: |
          for path in \
            "$GITHUB_WORKSPACE/abbey" \
            "$GITHUB_WORKSPACE/abi" \
            "$RUNNER_TEMP/abbey-mesh-state" \
            "$RUNNER_TEMP/abbey-install-smoke"
          do
            if [ -e "$path" ]; then
              find "$path" -depth -delete
            fi
          done

  gate-macos:
    name: gate (macOS ARM64 adjunct)
    if: >
      vars.ABBEY_MACOS_ARM64_RUNNER == 'enabled' &&
      github.repository == 'donaldfilimon/abbey' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, abbey]
    steps:
      - name: Check out Abbey
        uses: actions/checkout@v4
        with:
          path: abbey

      - name: Check out the verified ABI dependency
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/abi
          ref: ${{ env.ABI_REVISION }}
          path: abi

      - name: Check out the WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx-substrate
          ref: ${{ env.WDBX_REVISION }}
          token: ${{ secrets.WDBX_CHECKOUT_TOKEN }}
          path: wdbx

      - name: Install pinned toolchain
        working-directory: abbey
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version

      - name: Build the real ABI binary
        working-directory: abi
        run: ./tools/cargo.sh build -p abi-cli

      - name: Gate both Abbey feature sets
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: ./check.sh

      - name: Install cargo-audit if absent
        run: |
          command -v cargo-audit >/dev/null 2>&1 && exit 0
          cargo install cargo-audit --locked

      - name: RustSec dependency scan
        working-directory: abbey
        env:
          ABBEY_DEP_SCAN_REQUIRE: "1"
        run: ./tools/security/run-dep-scan.sh

      - name: Warning-denied API docs and release binary
        working-directory: abbey
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items
          cargo build --release --locked
          ./target/release/abbey --version

      - name: Release install and provider inventory smoke
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
        run: |
          smoke_root="${RUNNER_TEMP}/abbey-install-smoke"
          mkdir -p "$smoke_root/bin" "$smoke_root/home"
          ABBEY_INSTALL_DIR="$smoke_root/bin" \
            ABBEY_COMPLETION_HOME="$smoke_root/home" ./install.sh
          export HOME="$smoke_root/home"
          export XDG_CONFIG_HOME="$smoke_root/home/.config"
          export XDG_STATE_HOME="$smoke_root/home/.local/state"
          export ABBEY_CONFIG="$smoke_root/home/.config/abbey/config.toml"
          export ABBEY_STATE_DIR="$smoke_root/state"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$ABBEY_STATE_DIR"
          "$smoke_root/bin/abbey" --version
          "$smoke_root/bin/abbey" plugins abi list >/dev/null
          ABBEY_BACKEND=abi "$smoke_root/bin/abbey" mcp status >/dev/null
          ABBEY_BACKEND=fm "$smoke_root/bin/abbey" mcp paths >/dev/null
          "$smoke_root/bin/abbey" skills >/dev/null

      - name: ABI-backed local mesh proof
        working-directory: abbey
        env:
          ABBEY_ABI_BIN: ${{ github.workspace }}/abi/target/debug/abi
          ABBEY_STATE_DIR: ${{ runner.temp }}/abbey-mesh-state
        run: cargo run --release --bin abbey -- mesh local-demo --nodes 3 --json

      - name: Clean runner workspace
        if: always()
        run: |
          for path in \
            "$GITHUB_WORKSPACE/abbey" \
            "$GITHUB_WORKSPACE/abi" \
            "$RUNNER_TEMP/abbey-mesh-state" \
            "$RUNNER_TEMP/abbey-install-smoke"
          do
            if [ -e "$path" ]; then
              find "$path" -depth -delete
            fi
          done
