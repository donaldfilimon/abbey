[package]
name = "abbey"
version = "2.6.0"
edition = "2024"
rust-version = "1.85"
description = "Abbey — hybrid persona/role CLI/TUI with OS control, parallel lanes, skills/plugins inventory, self-learn"
license = "MIT"
authors = ["Donald Filimon"]
readme = "README.md"
keywords = ["tui", "agent", "cursor", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "abbey"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "plist-load",
    "yaml-load",
    "regex-onig",
] }
thiserror = "2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
abi-ai = { path = "../abi/crates/abi-ai" }
abi-wdbx = { path = "../abi/crates/abi-wdbx", optional = true }
# Cross-platform advisory lock for the WDBX store (Unix flock / Win LockFileEx).
fs2 = { version = "0.4", optional = true }

# SIGPIPE reset only — already in the tree transitively, so this costs no extra
# build. Unix-gated: Windows has no SIGPIPE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# In-process WDBX memory backend. Off by default: pulls the abi-wdbx crate and
# its portable_simd/sha2/num-bigint tree. Gate with `--features wdbx`.
wdbx = ["dep:abi-wdbx", "dep:fs2"]

[profile.release]
lto = true
codegen-units = 1
strip = true
