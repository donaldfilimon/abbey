[package]
name = "abbey"
version = "2.6.0"
edition = "2024"
rust-version = "1.99"
default-run = "abbey"
description = "Abbey — hybrid persona/role CLI/TUI with OS control, parallel lanes, skills/plugins inventory, self-learn"
license = "MIT"
authors = ["Donald Filimon"]
readme = "README.md"
keywords = ["tui", "agent", "cursor", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "abbey"
path = "src/main.rs"

# `unsafe_code` is allow-by-default in rustc, so `clippy -D warnings` in
# check.sh never caught it. Denying here means every `cargo build`/`clippy`
# and every editor surfaces new unsafe immediately, and each existing use has
# to carry an explicit, justified `#[allow]`. Abbey shells out to other
# processes; it has no business growing unsafe by accident. Mirrors the
# sibling ABI workspace, which denies `unsafe_code` workspace-wide.
[lints.rust]
unsafe_code = "deny"

[dependencies]
anyhow = "1"
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "6"
ratatui = "0.30.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49.9", default-features = false }
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
thiserror = "2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
url = "2"
# CI checks the sibling ABI checkout out at the immutable revision declared in
# .github/workflows/rust.yml. Local path dependencies preserve the same layout.
abi-capability = { path = "../abi/crates/abi-capability" }
abi-ai = { path = "../abi/crates/abi-ai" }
abi-agent-host = { path = "../abi/crates/abi-agent-host" }
abi-agent-runtime = { path = "../abi/crates/abi-agent-runtime" }
abi-model-runtime = { path = "../abi/crates/abi-model-runtime" }
abi-models = { path = "../abi/crates/abi-models" }
abi-worker = { path = "../abi/crates/abi-worker" }
abi-wdbx = { path = "../wdbx/crates/abi-wdbx", optional = true }
# Accelerator execution bridge (see `--features accel`). Two crates, because
# abi-gpu re-exports its adapters but NOT the `Accelerator` trait or the
# `CpuBackend` oracle they are written against — those live in abi-compute.
abi-gpu = { path = "../abi/crates/abi-gpu", optional = true }
abi-compute = { path = "../wdbx/crates/abi-compute", optional = true }
# Cross-platform advisory lock for WDBX and canonical identity writes
# (Unix flock / Windows LockFileEx).
fs4 = "0.13"
pulldown-cmark = { version = "0.13.4", default-features = false }

[dev-dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "70f72e9cfdbfc570846ca363ead2135394af3e9a", version = "0.11", default-features = false }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
abi-sea = { path = "../abi/crates/abi-sea" }
ed25519-dalek = "3"

# SIGPIPE reset only — already in the tree transitively, so this costs no extra
# build. Unix-gated: Windows has no SIGPIPE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal", "user"] }

[features]
default = []
# In-process WDBX memory backend. Optional and off by default: uses the sibling
# path crates (`../wdbx/crates/abi-wdbx` and, through it, `abi-compute`). Those
# crates build on stable Rust 1.99.1 without a `portable_simd` feature gate.
# Gate with `--features wdbx`.
wdbx = ["dep:abi-wdbx"]
# Compile-time edition selector. OFF by default: the default build is the SAFE
# public edition (allowlist + --confirm, unchanged paths). Enabling it builds a
# separately identified personal edition — distinct binary/bundle name, config
# root, credential namespace, and audit log path (`src/edition.rs`). It does
# NOT enable an unrestricted runtime: no shell.exec, no privileged helper, and
# no always-on unrestricted mode exists in either edition. check.sh gates this
# feature explicitly, or the cfg'd paths rot behind the default gate.
personal-edition = []
# Real accelerator *execution* for one numerical kernel set, via ABI's
# MetalAccelerator, each result checked against the deterministic CPU oracle in
# the same run. OFF by default: abi-gpu's build script shells out to
# `xcrun swiftc` to build a Metal/CoreML dylib, which is a macOS-toolchain
# dependency the default build must not acquire. This feature does NOT add
# GPU/NPU/TPU compilation, training, or model inference, and it makes no
# placement or performance claim — see `accelerator-kernel-execution-metal` in
# src/claims/registry.rs. check.sh gates it explicitly, or `src/accel.rs` rots
# behind the default gate.
accel = ["dep:abi-gpu", "dep:abi-compute", "abi-model-runtime/metal"]

[profile.release]
lto = true
codegen-units = 1
strip = true
