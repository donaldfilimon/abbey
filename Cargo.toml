[package]
name = "abbey"
version = "2.6.0"
edition = "2024"
rust-version = "1.99"
default-run = "abbey"
description = "Abbey — hybrid persona/role CLI/TUI with OS control, parallel lanes, skills/plugins inventory, self-learn"
license = "MIT"
authors = ["Donald Filimon"]
readme = "README.md"
keywords = ["tui", "agent", "cursor", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "abbey"
path = "src/main.rs"

# `unsafe_code` is allow-by-default in rustc, so `clippy -D warnings` in
# check.sh never caught it. Denying here means every `cargo build`/`clippy`
# and every editor surfaces new unsafe immediately, and each existing use has
# to carry an explicit, justified `#[allow]`. Abbey shells out to other
# processes; it has no business growing unsafe by accident. Mirrors the
# sibling ABI workspace, which denies `unsafe_code` workspace-wide.
[lints.rust]
unsafe_code = "deny"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "6"
ratatui = "0.30.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
thiserror = "2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
url = "2"
abi-ai = { path = "../abi/crates/abi-ai" }
abi-wdbx = { path = "../abi/crates/abi-wdbx", optional = true }
# Cross-platform advisory lock for the WDBX store (Unix flock / Win LockFileEx).
fs4 = { version = "0.13", optional = true }

# SIGPIPE reset only — already in the tree transitively, so this costs no extra
# build. Unix-gated: Windows has no SIGPIPE.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal", "user"] }

[features]
default = []
# In-process WDBX memory backend. Off by default: pulls the abi-wdbx crate and
# its portable_simd/sha2/num-bigint tree. Gate with `--features wdbx`.
wdbx = ["dep:abi-wdbx", "dep:fs4"]

[profile.release]
lto = true
codegen-units = 1
strip = true
